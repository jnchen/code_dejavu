<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring - memory cycle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="24"/>
  <!-- Spiral path - déjà vu feeling -->
  <path d="M 256 136 A 120 120 0 1 1 176 316" fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <path d="M 256 176 A 80 80 0 1 1 206 306" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 256 216 A 40 40 0 1 1 236 286" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="12" stroke-linecap="round"/>
  <!-- Arrow tip on outer spiral -->
  <polygon points="168,308 188,330 160,326" fill="white"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="10" fill="white"/>
</svg>
