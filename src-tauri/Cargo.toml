[package]
name = "code-dejavu"
version = "0.3.1"
description = "Coding agent session and profile manager"
authors = ["Code Déjà Vu contributors"]
edition = "2021"

[lib]
name = "code_dejavu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
jieba-rs = "0.7"
bincode = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
